version: '3.9'

networks:
  pams-network:
    driver: bridge

services:
  postgres:
    image: postgres:17-alpine
    container_name: pams-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pams_db
      POSTGRES_USER: pams_user
      POSTGRES_PASSWORD: pams_secret
    ports:
      - "5432:5432"
    volumes:
      - pams_pgdata:/var/lib/postgresql/data
    networks:
      - pams-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pams_user -d pams_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pams-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: pams_user
      DB_PASSWORD: pams_secret
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pams-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pams-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - pams-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pams-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pams.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    volumes:
      - pams_pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - pams-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pams_pgdata:
    driver: local
  pams_pgadmin_data:
    driver: local
