spring.application.name=policy-attribute

# ── PostgreSQL JDBC Datasource (For Flyway Migrations Only) ──
# Spring Boot 4 FlywayAutoConfiguration requires a DataSource bean — set this even in WebFlux apps.
spring.datasource.url=jdbc:postgresql://localhost:5432/pams_db
spring.datasource.username=${DB_USERNAME:pams_user}
spring.datasource.password=${DB_PASSWORD:pams_secret}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.url=jdbc:postgresql://localhost:5432/pams_db
spring.flyway.user=${DB_USERNAME:pams_user}
spring.flyway.password=${DB_PASSWORD:pams_secret}

# ── PostgreSQL R2DBC Datasource ──
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/pams_db
spring.r2dbc.username=${DB_USERNAME:pams_user}
spring.r2dbc.password=${DB_PASSWORD:pams_secret}

# ── Flyway ──
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate: allows Flyway to run on a DB that already has schema but no flyway history
spring.flyway.baseline-on-migrate=true
# baseline-version=0: ensures ALL migrations (V1, V2...) run on a completely fresh/empty database.
# Without this, baseline-on-migrate defaults to baseline at V1, skipping V1's table creation SQL.
spring.flyway.baseline-version=0

# ── File Upload (WebFlux Codec Limit) ──
spring.codec.max-in-memory-size=10MB

# ── Server ──
server.port=8080
debug=false
spring.test.webclient.timeout=30s
