plugins {
	id 'org.jetbrains.kotlin.jvm' version '2.2.0'
	id 'org.jetbrains.kotlin.plugin.spring' version '2.2.0'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.example.kk'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

kotlin {
	compilerOptions {
		// JSpecify null-safety annotations (adopted in Spring Boot 4 / Spring Framework 7)
		// replace JSR-305; keeping -Xjsr305=strict for backward-compat with any remaining annotations
		freeCompilerArgs.addAll '-Xjsr305=strict'
		apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_2
		languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_2
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// ── Spring Boot Starters ──
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// ── Kotlin & Coroutines ──
	implementation 'org.jetbrains.kotlin:kotlin-reflect'
	// Jackson 3 (Spring Boot 4) — Kotlin module moved to tools.jackson namespace
	implementation 'tools.jackson.module:jackson-module-kotlin'
	implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core'
	implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-reactor'
	implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-reactive'

	// ── Database ──
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.postgresql:r2dbc-postgresql'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	// Spring Boot 4 modularization: FlywayAutoConfiguration moved to spring-boot-flyway
	implementation 'org.springframework.boot:spring-boot-flyway'

	// ── CSV Parsing (Streaming) ──
	implementation 'com.opencsv:opencsv:5.9'

	// ── API Documentation ──
	implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.8'

	// ── Test ──
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-webflux-test'
	testImplementation 'io.mockk:mockk:1.13.10'
	testImplementation 'com.ninja-squad:springmockk:5.0.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
	classDirectories.setFrom(files(classDirectories.files.collect {
		fileTree(dir: it, exclude: [
			"com/example/kk/policyattribute/model/**",
			"com/example/kk/policyattribute/dto/**",
			"com/example/kk/policyattribute/PolicyAttributeApplication*"
		])
	}))
}

jacocoTestCoverageVerification {
	violationRules {
		rule {
			limit {
				minimum = 0.8
			}
		}
	}
	classDirectories.setFrom(files(classDirectories.files.collect {
		fileTree(dir: it, exclude: [
			"com/example/kk/policyattribute/model/**",
			"com/example/kk/policyattribute/dto/**",
			"com/example/kk/policyattribute/PolicyAttributeApplication*"
		])
	}))
}
